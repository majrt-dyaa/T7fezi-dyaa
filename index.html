<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مجرّة ضياء</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--panel:#0b0f0f;--line:#1d2a29;--ink:#efe9df;--mute:#8d9a97;--teal:#4FB3AE;--orange:#E08A5C;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Tajawal,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:8px 18px}
header img{height:42px;mix-blend-mode:screen}
header h1{font:700 19px "Reem Kufi",Tajawal,sans-serif;margin:0}
header p{margin:0;color:var(--mute);font-size:13px}
nav{display:flex;gap:6px;padding:8px 14px;border-block:1px solid var(--line);overflow-x:auto}
nav button{white-space:nowrap;border-radius:99px;padding:7px 15px;border-color:var(--c)}
nav button[aria-current=true]{background:var(--c);color:#06100f;font-weight:700}
main{flex:1;display:flex;min-height:0}
#stage{flex:1;position:relative;min-width:0}
canvas{width:100%;height:100%;display:block}
#feed{position:absolute;top:12px;inset-inline:0;margin:auto;width:max-content;max-width:90%;padding:7px 16px;border:1px solid var(--line);border-radius:99px;background:rgba(0,0,0,.7);font-size:14px;opacity:0;transition:opacity .4s;pointer-events:none}
#feed.on{opacity:1}
aside{width:340px;background:var(--panel);border-inline-start:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px;overflow:auto}
aside h2{font:700 20px "Reem Kufi",Tajawal,sans-serif;margin:0}
#who{margin:0;color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;color:var(--ink);background:#141c1b;border:1px solid var(--line);border-radius:10px;padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--mute)}
button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
input{font:inherit;color:var(--ink);background:#141c1b;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input:focus-visible{outline:2px solid var(--teal)}
input:disabled{opacity:.5}
.primary{background:var(--orange);color:#1a0c05;border-color:var(--orange);font-weight:700}
.small{background:none;border:0;color:var(--mute);font-size:13px;padding:4px}
#cm{display:flex;flex-direction:column;gap:10px}
.it{border:1px solid var(--line);border-radius:12px;padding:10px;background:#0f1514;display:flex;flex-direction:column;gap:8px}
.ith{display:flex;align-items:center;gap:8px}
.ith b{flex:1}
.ith span{color:var(--orange);font-weight:700}
.x{background:none;border:0;color:var(--mute);padding:2px 6px;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.grid label{display:flex;flex-direction:column;gap:2px;font-size:12px}
#newit{display:flex;flex-direction:column;gap:6px;border:1px dashed var(--line);border-radius:12px;padding:10px}
#newit .row input:last-child{width:110px}
ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
li{display:grid;grid-template-columns:22px 1fr auto;gap:2px 10px;align-items:center;padding:8px 10px;border-radius:10px}
li .bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
li .bar i{display:block;height:100%;transition:width .6s}
.rk{color:var(--mute);font-size:13px}
.fg{font-style:normal;color:var(--orange);font-size:13px}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;z-index:9;padding:20px}
#ov.on{display:flex}
#ovT{font:700 26px "Reem Kufi",Tajawal,sans-serif;color:var(--mute)}
#ovN{font:700 clamp(38px,11vw,96px) "Reem Kufi",Tajawal,sans-serif;min-height:1.2em;line-height:1.2}
#ovN.pop{animation:pop .9s ease-out}
#ovN.win{animation:win 1s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes win{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
#flag{width:84px;height:100px;opacity:0;transform:translateY(60px);transition:all 1s}
#flag.up{opacity:1;transform:none}
#ovS{font-size:18px;min-height:1.4em}
#ovL{display:flex;flex-direction:column;gap:6px;width:min(340px,86vw)}
.lr{display:flex;justify-content:space-between;font:700 18px Tajawal,sans-serif;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:#0b0f0f;animation:pop .5s}
input[type=checkbox]{width:auto}
select,textarea{font:inherit;color:var(--ink);background:#141c1b;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
#pin{padding:6px 14px;background:#120d08;border-bottom:1px solid var(--line);display:flex;gap:14px;overflow-x:auto}
#pin button{background:none;border:0;color:var(--orange);white-space:nowrap;padding:3px 6px}
#pv{position:fixed;inset:var(--pvt,0px) 0 0 0;z-index:5;background:var(--bg);overflow:auto;padding:16px 18px 40px}
#pv>*{max-width:860px;margin-inline:auto}
.back{display:block;margin-bottom:14px}
#pv h2{font:700 26px "Reem Kufi",Tajawal,sans-serif;margin-block:8px}
#pv h3{font:700 16px "Reem Kufi",Tajawal,sans-serif;color:var(--mute);margin-block:18px 8px}
#pv p{margin:4px 0}
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-block:10px}
.frm .wide{grid-column:1/-1}
.ev,.an{display:flex;gap:12px;align-items:flex-start;padding:10px 12px;margin-block:6px;border:1px solid var(--line);border-inline-start:4px solid var(--c,var(--orange));border-radius:10px;background:#0b0f0f}
.ev>span:first-child{font-size:24px}
.ev>div,.an>div{flex:1}
.ev button,.an button{padding:4px 8px;font-size:13px}
.dim{opacity:.45}
.fh{display:flex;gap:16px;align-items:center;padding:18px;border-radius:16px;background:radial-gradient(circle at 80% 20%,color-mix(in srgb,var(--c) 28%,transparent),transparent 60%),#0b0f0f;border:1px solid var(--c)}
.fi{font-size:48px;width:84px;height:84px;flex:none;display:grid;place-items:center;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 30px var(--c)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:12px;text-align:center}
.stats div{padding:12px;border:1px solid var(--line);border-radius:12px;color:var(--mute);font-size:13px}
.stats b{display:block;font:700 28px "Reem Kufi",sans-serif;color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span,.chips button{border:1px solid;border-radius:99px;padding:4px 12px;font-size:13px}
.mu{color:var(--mute)}
.tl{border-inline-start:2px solid var(--c);padding-inline-start:12px}
#syn{position:fixed;left:8px;bottom:6px;z-index:9;font-size:11px;color:var(--mute);background:#0a0f0ecc;border:1px solid var(--line);border-radius:99px;padding:3px 10px;cursor:pointer}#syn.bad{color:#ffb4a8;border-color:#D6665A}body.pj #syn{display:none}
#pjbar,#pjx{display:none}
body.ro .ed,body.lk .ed,body.pj .ed{display:none!important}
body.pj header,body.pj nav,body.pj aside{display:none!important}
body.pj #pjbar{display:block;position:absolute;bottom:48px;inset-inline:0;text-align:center;font:700 clamp(18px,2.4vw,34px) "Reem Kufi",Tajawal,sans-serif;color:var(--orange);padding:0 20px;pointer-events:none}
body.pj #pjx{display:block;position:fixed;top:10px;inset-inline-start:10px;z-index:8;opacity:.15}
body.pj #pjx:hover{opacity:1}
body.pj #pv{font-size:1.4em}
body.pj #pin button{font-size:clamp(16px,2vw,26px)}
#feed.err{border-color:#D6665A;color:#ffb4a8}
#now{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:7px 16px;border-bottom:1px solid var(--line);background:#0a0f0e;font-size:14px}
#now .nw{color:var(--teal)}
#now small{color:var(--mute)}
#now b{font-variant-numeric:tabular-nums}
#lb{position:fixed;inset:0;z-index:12;background:rgba(0,0,0,.93);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;cursor:zoom-out}
#lb[hidden]{display:none}
#lb img{max-width:96vw;max-height:80vh;border-radius:12px}
.th{width:96px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#101716;flex:none}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.gal figure{margin:0;border:1px solid var(--line);border-inline-start:4px solid var(--c);border-radius:12px;overflow:hidden;background:#0b0f0f}
.gal .th{width:100%;height:150px;border:0;border-radius:0}
.gal figcaption{padding:8px 10px;font-size:13px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-block:10px}
.tabs button{border-radius:99px;padding:6px 14px;font-size:14px}
.tabs button[aria-current=true]{background:var(--orange);color:#1a0c05;border-color:var(--orange);font-weight:700}
.wl{display:flex;flex-wrap:wrap;gap:14px;align-items:baseline;padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:radial-gradient(circle at 15% 0%,#4FB3AE22,transparent 55%),#0b0f0f}
.wl h2{margin:0!important}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pc{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:16px;border:1px solid var(--line);border-top:3px solid var(--c);background:radial-gradient(circle at 85% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 60%),#0b0f0f}
.pc.cu{box-shadow:0 0 0 1px var(--c)}
.pc h4{margin:0;font:700 18px "Reem Kufi",Tajawal,sans-serif}
.pc .ic{font-size:30px;line-height:1}
.pc .tp{display:flex;gap:10px;align-items:center}
.pc .tp>div{flex:1}
.bdg{font-size:12px;padding:2px 10px;border-radius:99px;border:1px solid var(--b);color:var(--b)}
.pc .row button{padding:6px 12px;font-size:13px}
.hero{display:flex;gap:12px;flex-wrap:wrap;margin-block:10px}
.hl{flex:1;min-width:230px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:#0b0f0f;display:flex;flex-direction:column;gap:4px}
.hl.live{border-color:var(--teal);box-shadow:0 0 24px #4FB3AE33}
.hl small{color:var(--mute)}
.hl b{font:700 22px "Reem Kufi",Tajawal,sans-serif}
.hl span b{font:700 18px Tajawal,sans-serif;color:var(--orange);font-variant-numeric:tabular-nums}
.ar{display:flex;gap:10px;align-items:center;padding:10px 12px;margin-block:6px;border:1px solid var(--line);border-inline-start:4px solid var(--c);border-radius:10px;background:#0b0f0f;flex-wrap:wrap}
.ar.dn{opacity:.55}
.ar .tm{min-width:110px;color:var(--mute);font-size:13px}
.ar .ti{flex:1;min-width:140px}
.ar .pb{flex-basis:100%;height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.ar .pb i{display:block;height:100%;background:var(--teal)}
.ar button{padding:4px 10px;font-size:13px}
.bars{display:flex;flex-direction:column;gap:8px}
.bars div{display:grid;grid-template-columns:130px 1fr 36px;gap:10px;align-items:center;font-size:14px}
.bars i{display:block;height:10px;border-radius:5px;background:var(--c)}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
table.dt th,table.dt td{border:1px solid var(--line);padding:6px 8px;text-align:center}
table.dt th{color:var(--mute);font-weight:400}
.win{padding:18px;border-radius:16px;border:1px solid var(--orange);background:radial-gradient(circle at 50% 0%,#E08A5C33,transparent 65%),#0b0f0f;text-align:center}
.win b{display:block;font:700 clamp(26px,5vw,44px) "Reem Kufi",Tajawal,sans-serif;color:var(--orange)}
.stats.s4{grid-template-columns:repeat(auto-fit,minmax(110px,1fr))}
.chips.col{flex-direction:column}
body.vr .ad,body.pj .ad,body.ro .ad{display:none!important}
body.ro .vw,body.pj .vw{display:none!important}
body.pj #now{font-size:clamp(18px,2.2vw,32px);padding:10px 24px;position:relative;z-index:2}
body.pj .hl b{font-size:clamp(26px,3vw,48px)}
body.pj .ar{font-size:1.15em}
body.pj .gal{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
@media(max-width:760px){header{gap:8px;padding:6px 10px}header>div{min-width:0}header button{padding:6px 9px;font-size:12px}header img{height:30px}header h1{font-size:15px}header p{font-size:11px}main{flex-direction:column}aside{width:100%;max-height:56%;border-inline-start:0;border-top:1px solid var(--line)}header img{height:36px}}
@media(prefers-reduced-motion:reduce){#ovN,#flag,.lr{animation:none;transition:none}}
</style>

async function swirl(ti){
  const n=FAM.length;if(n<1||ti<0)return;

  if(RM||n===1){SW.on=true;SW.i=ti;SW.land=true;await wait(1200);return}

  const tp=ord.indexOf(ti),st=Math.floor(Math.random()*n),D=q=>70+1050*Math.pow(q,2.6);
  const base=Math.round(SWIRL_MS/(70+1050/3.6)),total=base+((tp-(st+base)%n)+n)%n;
  const msgs=[[0,'والراية تذهب إلى…'],[.4,'الضوء يبحث بين الكواكب…'],[.68,'اقتربنا…'],[.86,'…']];let mi=0,t0=performance.now();
  SW.on=true;SW.land=false;
  for(let k=0;k<=total;k++){SW.i=ord[(st+k)%n];const q=k/total;while(mi<msgs.length&&q>=msgs[mi][0]){if(ov.classList.contains('see'))ovT.textContent=msgs[mi][1];mi++}vib(k>total-4?18:6);await wait(D(q))}

}

function shrink(file){return new Promise((res,rej)=>{
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{try{
    let mx=900,q=.74,out='';
    for(let k=0;k<8;k++){
      const sc=Math.min(1,mx/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);
      if(out.length<190000)break;q-=.08;if(q<.45){q=.7;mx*=.78}
    }
    URL.revokeObjectURL(u);out.length<235000?res(out):rej(new Error('big'));
  }catch(e){rej(e)}};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}

/* ----- الجدول الزمني ----- */

function visStart(){if(visSub||ro||!window.FB||!FB.visWatch)return;visSub=1;visSub=FB.visWatch((l,e)=>{if(l){VIS=l;VISERR=null}else VISERR=e;if(view&&view.t==='adm'&&view.tab==='vis')setTimeout(drawV,0)})}

document.addEventListener('click',async e=>{const b=e.target.closest('.vdel');if(!b||ro)return;if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='تأكيد؟';setTimeout(()=>{b.dataset.ok='';b.textContent='✕'},2500);return}try{await FB.visDel(b.dataset.vid)}catch(x){say('⚠️ تعذّر الحذف','err')}});

/* ===== أعضاء الأسر ===== */
const memKey=(z,vid,n)=>vid?z.v===vid:(!z.v&&z.n===n);
function famOf(vid,n){return FAM.findIndex(f=>(f.m||[]).some(z=>memKey(z,vid,n)))}
function assignMember(vid,n,fi){if(lk())return;FAM.forEach(f=>{f.m=(f.m||[]).filter(z=>!memKey(z,vid,n))});if(fi>=0&&FAM[fi]){FAM[fi].m.push({n:String(n).slice(0,40),v:vid||''})}save();drawV();say(fi>=0?'✔ أُضيف «'+n+'» إلى '+FAM[fi].n:'أُزيل «'+n+'» من أسرته')}
function memSection(fi){const f=FAM[fi],m=f.m||[];
  return `<h3>👥 أعضاء الأسرة <small class="mu">(${m.length})</small></h3>`+(m.length?`<div class="chips">${m.map((z,j)=>`<span style="border-color:${f.c}">${esc(z.n)}<button class="ed mdel" data-fi="${fi}" data-j="${j}" style="border:0;background:none;padding:0 4px">✕</button></span>`).join('')}</div>`:'<p class="mu">لم يُضف أعضاء بعد.</p>')+
  `<form class="frm ed memadd" data-fi="${fi}"><input name="n" required maxlength="40" placeholder="اسم طالب لإضافته يدويًا"><button>إضافة</button></form>`}
document.addEventListener('click',e=>{const b=e.target.closest('.mdel');if(!b||lk())return;e.stopPropagation();const f=FAM[+b.dataset.fi];if(!f)return;const z=f.m[+b.dataset.j];if(!z)return;
  if(b.dataset.ok!=='1'){b.dataset.ok='1';b.textContent='تأكيد؟';setTimeout(()=>{b.dataset.ok='';b.textContent='✕'},2500);return}
  f.m.splice(+b.dataset.j,1);save();drawV();say('أُزيل «'+z.n+'» من '+f.n)},true);
document.addEventListener('submit',e=>{const f=e.target.closest('.memadd');if(!f)return;e.preventDefault();e.stopPropagation();const n=(f.n.value||'').trim().replace(/\s+/g,' ');if(n.length<2)return;assignMember('',n,+f.dataset.fi)},true);

/* ===== إرسال الإشعارات تلقائيًا (للمدير) ===== */
let PCFG=null,PKEY=null,pushKnown=null,lastLocalSubmit=0;
async function pushLoad(){if(ro||!window.FB)return;try{PCFG=await FB.get('state/push')||{};if(!PCFG.appId)PCFG.appId='7e38f56f-34d2-446e-ba35-d70aaa5bdb6a';PKEY=await FB.get('secret/onesignal')}catch(e){PKEY=null}}
async function pushSend(title,body){
  if(!PCFG||!PCFG.appId||!PKEY||!PKEY.key)return {ok:false,err:'لم تُضبط مفاتيح OneSignal بعد'};
  const send=seg=>fetch('https://api.onesignal.com/notifications?c=push',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Key '+PKEY.key},
    body:JSON.stringify({app_id:PCFG.appId,target_channel:'push',included_segments:[seg],headings:{en:title,ar:title},contents:{en:body||title,ar:body||title},url:location.origin+location.pathname})});
  try{let r=await send('Total Subscriptions');let j=await r.json().catch(()=>({}));
    if(!r.ok||(j.errors&&String(j.errors).includes('segment'))){r=await send('Subscribed Users');j=await r.json().catch(()=>({}))}
    if(!r.ok||j.errors)return {ok:false,err:JSON.stringify(j.errors||r.status).slice(0,140)};
    return {ok:true,n:j.recipients};
  }catch(e){return {ok:false,err:'تعذّر الاتصال بـ OneSignal ('+(e.message||e)+')'}}
}
const pIds=()=>new Set([...ann.map(x=>'a'+x.id),...ach.map(x=>'h'+x.id)]);
document.addEventListener('submit',e=>{const a=e.target&&e.target.dataset&&e.target.dataset.a;if(a==='ann-save'||a==='ach-save')lastLocalSubmit=Date.now()},true);
setInterval(async()=>{
  if(ro||!synced.size)return;
  if(!pushKnown){pushKnown=pIds();pushLoad();return}
  const now=pIds(),fresh=[...now].filter(k=>!pushKnown.has(k));pushKnown=now;
  if(!fresh.length||Date.now()-lastLocalSubmit>4000)return;
  if(!PCFG||PCFG.auto===false)return;
  for(const k of fresh){
    let t,bd;
    t='مجرّة ضياء';
    if(k[0]==='a'){const x=ann.find(z=>'a'+z.id===k);if(!x||x.hide)continue;bd='📣 '+x.t+(x.b?'\n'+x.b:'')}
    else{const x=ach.find(z=>'h'+z.id===k);if(!x||x.hide)continue;bd='🏆 '+(x.i?x.i+' ':'')+((FAM[x.f]||{}).n||'')+': '+x.t}
    const r=await pushSend(t,bd);say(r.ok?'🔔 أُرسل إشعار للمشتركين':'⚠️ ما انرسل الإشعار: '+r.err,r.ok?'':'err');
  }
},1500);

  <p class="mu">المفتاح يُحفظ في Firebase ولا يقرؤه إلا حساب المدير.</p>`;

document.addEventListener('submit',async e=>{
  const f=e.target;if(!f.classList)return;

function subProg(pid){

  {
